# =============================================================================
# ApeAdmin Algorithm Platform - Docker Compose 部署配置
#
# 使用方法:
#   1. 复制 .env.docker 为 .env 并修改配置
#   2. 执行 docker-compose up -d 启动服务
#   3. 访问 http://localhost:8080
#
# 服务架构:
#   - backend: FastAPI 后端（内置前端静态文件托管）
#   - mysql: MySQL 8.0 数据库
#   - redis: Redis 缓存
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL 数据库
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: apeadmin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-apeadmin}
      MYSQL_USER: ${DB_USER:-apeadmin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apeadmin123}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apeadmin-network

  # ---------------------------------------------------------------------------
  # Redis 缓存
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: apeadmin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apeadmin-network

  # ---------------------------------------------------------------------------
  # 后端服务（包含前端静态文件）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apeadmin-backend
    restart: unless-stopped
    environment:
      # 数据库（连接到 docker-compose 服务名）
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-apeadmin}
      DB_USER: ${DB_USER:-apeadmin}
      DB_PASSWORD: ${DB_PASSWORD:-apeadmin123}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # 应用
      DEBUG: "False"
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    volumes:
      - backend_models:/app/models
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apeadmin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Nginx 反向代理（可选，如果不需要额外配置可以不用）
  # ---------------------------------------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   container_name: apeadmin-nginx
  #   restart: unless-stopped
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - apeadmin-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_models:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  apeadmin-network:
    driver: bridge
