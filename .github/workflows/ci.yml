name: CI

on:
  push:
    branches: [main, "wzcb/Apeadmin"]
  pull_request:
    branches: [main, "wzcb/Apeadmin"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio
      - name: Run pytest
        run: |
          set -o pipefail
          pytest -q --timeout=60 2>&1 | tee pytest_out.txt
      - name: Annotate failing tests
        # 把 pytest 失败摘要打成 check-run 标注（::error::），
        # 标注是公开的，可直接经 API/页面查看，省去下载完整日志。
        if: failure()
        run: |
          grep -E "FAILED|ERROR collecting|AssertionError|ModuleNotFoundError|AttributeError|TypeError" pytest_out.txt \
            | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::error::（查看完整日志见上方 Run pytest 步骤）"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build (typecheck + vite)
        run: npm run build
