[project]
name = "apeadmin"
version = "0.1.0"
description = "ApeAdmin - FastAPI + Vue3 admin framework with plugin & MCP support"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "redis>=5.0.0",
    "orjson>=3.10.0",
    "psutil>=5.9.0",
    # ── AI 推理运行时真依赖（之前漏声明，导致干净环境/CI 装不上）──
    "numpy>=1.24.0",
    "opencv-python-headless>=4.10.0",
    "onnxruntime>=1.16.0",
    # ── 报警外发（MQTT / Webhook）：MQTT 渠道依赖，未安装则自动降级 ──
    "paho-mqtt>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
apeadmin = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 防止个别网络/线程测试挂起导致 CI 卡死（默认 60s 超时）
timeout = 60


[tool.alembic]
script_location = "alembic"
sqlalchemy.url = ""
